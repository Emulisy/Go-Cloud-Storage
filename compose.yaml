services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: cloudstorage-caddy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cloudstorage-app

    environment:
      MYSQL_ADDR: mysql:3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: cloudstorage-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/table.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudstorage-redis

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3}
    profiles: [minio]
    command: ["server", "/data", "--license", "/etc/minio/minio.license"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
      - type: bind
        source: ${MINIO_CONFIG_DIR:-/etc/gocloudstorage/minio}/minio.license
        target: /etc/minio/minio.license
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  minio_data:

secrets:
  minio_root_user:
    environment: MINIO_ROOT_USER
  minio_root_password:
    environment: MINIO_ROOT_PASSWORD
