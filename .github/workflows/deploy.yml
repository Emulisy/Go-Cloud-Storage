name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AZURE_VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application files
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            -e 'ssh -i ~/.ssh/id_ed25519' \
            ./ "$SSH_USER@$SSH_HOST:/opt/gocloudstorage/"

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/gocloudstorage

          test -s .env
          docker compose config --quiet
          docker compose pull caddy mysql redis
          docker compose run --rm --no-deps caddy \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose up -d --build --remove-orphans --wait --wait-timeout 120
          docker compose ps
          REMOTE
