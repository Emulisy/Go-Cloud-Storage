name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AZURE_VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application files
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            -e 'ssh -i ~/.ssh/id_ed25519' \
            ./ "$SSH_USER@$SSH_HOST:/opt/gocloudstorage/"

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/gocloudstorage

          test -s .env
          docker compose config --quiet
          docker compose pull caddy mysql redis
          # SSH supplies this script on stdin; validation must not consume it.
          docker compose run --rm --no-deps -T --interactive=false caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null
          docker compose up -d --build --remove-orphans --wait --wait-timeout 120
          docker compose ps

          # A healthy container can still be running an older UI image.
          while IFS= read -r -d '' file; do
            expected=$(sha256sum "$file" | cut -d ' ' -f 1)
            actual=$(docker compose exec -T --interactive=false app sha256sum "/app/$file" </dev/null | cut -d ' ' -f 1)
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Running app has stale UI file: $file"
              exit 1
            fi
          done < <(find static -type f -print0)
          REMOTE

      - name: Verify public UI matches this commit
        env:
          APP_URL: https://emulisygocloud.southeastasia.cloudapp.azure.com
        run: |
          set -Eeuo pipefail
          while read -r route file; do
            response=$(mktemp)
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$APP_URL$route?deploy-check=$GITHUB_SHA" -o "$response"
            if ! cmp -s "$file" "$response"; then
              echo "::error::Public route $route does not match commit $GITHUB_SHA. Check the deployed VM and Caddy upstream."
              exit 1
            fi
            rm -f "$response"
          done <<'FILES'
          / static/view/landing.html
          /file/signin static/view/login.html
          /file/signup static/view/signup.html
          /assets/styles.css static/assets/styles.css
          /assets/app.js static/assets/app.js
          /assets/config.js static/assets/config.js
          /assets/controllers/account.js static/assets/controllers/account.js
          /assets/controllers/auth.js static/assets/controllers/auth.js
          /assets/controllers/files.js static/assets/controllers/files.js
          /assets/controllers/session.js static/assets/controllers/session.js
          /assets/controllers/upload.js static/assets/controllers/upload.js
          /assets/requests/files.js static/assets/requests/files.js
          /assets/requests/http.js static/assets/requests/http.js
          /assets/requests/uploads.js static/assets/requests/uploads.js
          /assets/requests/users.js static/assets/requests/users.js
          /assets/views/files.js static/assets/views/files.js
          /assets/views/forms.js static/assets/views/forms.js
          /assets/views/navigation.js static/assets/views/navigation.js
          /assets/views/shared.js static/assets/views/shared.js
          /assets/views/upload.js static/assets/views/upload.js
          /assets/views/user.js static/assets/views/user.js
          /assets/favicon.svg static/assets/favicon.svg
          FILES
