<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goCloudStorage demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 4rem auto; padding: 0 1rem; color: #172033; background: #f5f7fb; }
    main { background: white; border: 1px solid #dfe5ef; border-radius: 14px; padding: 2rem; box-shadow: 0 12px 35px rgba(30, 50, 80, .08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: .75rem; align-items: center; }
    input { flex: 1; min-width: 0; padding: .75rem; border: 1px solid #bac5d6; border-radius: 8px; background: white; }
    button { padding: .75rem 1rem; border: 0; border-radius: 8px; color: white; background: #245dcc; cursor: pointer; }
    p { color: #536176; } code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>goCloudStorage</h1>
    <p>Files larger than 100 MiB are uploaded in 5 MiB parts.</p>

    <h2>Upload a file</h2>
    <form action="/file/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Upload</button>
    </form>
    <progress id="upload-progress" max="100" value="0" hidden aria-label="Upload progress"></progress>
    <p id="upload-status" role="status" aria-live="polite"></p>

    <p><a href="/file/signup">Create a demo account</a></p>
  </main>
  <script>
    const form = document.querySelector("form");
    const input = form.querySelector('input[type="file"]');
    const button = form.querySelector("button");
    const progress = document.querySelector("#upload-progress");
    const status = document.querySelector("#upload-status");
    const multipartThreshold = 100 * 1024 * 1024;

    async function uploadRequest(url, body) {
      const response = await fetch(url, {
        method: "POST",
        credentials: "same-origin",
        body
      });
      if (response.status === 401) {
        window.location.assign("/file/signup");
        throw new Error("Please sign in again.");
      }
      if (!response.ok) {
        throw new Error((await response.text()).trim() || "Upload failed.");
      }
      return response.json();
    }

    form.addEventListener("submit", async (event) => {
      const file = input.files[0];
      if (!file || file.size <= multipartThreshold) return;
      event.preventDefault();
      button.disabled = true;
      input.disabled = true;
      progress.hidden = false;
      progress.value = 0;

      try {
        status.textContent = "Calculating file checksum…";
        const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
        const hash = Array.from(new Uint8Array(digest), byte =>
          byte.toString(16).padStart(2, "0")
        ).join("");
        const upload = await uploadRequest("/file/upload/init", new URLSearchParams({
          filehash: hash,
          filename: file.name,
          filesize: String(file.size)
        }));

        for (let index = 0; index < upload.chunkCount; index++) {
          status.textContent = `Uploading part ${index + 1} of ${upload.chunkCount}…`;
          const start = index * upload.chunkSize;
          const chunk = file.slice(start, Math.min(start + upload.chunkSize, file.size), "application/octet-stream");
          await uploadRequest(`/file/upload/part?${new URLSearchParams({
            filehash: hash, index: String(index)
          })}`, chunk);
          progress.value = Math.round(Math.min(start + chunk.size, file.size) / file.size * 100);
        }

        status.textContent = "Verifying and saving your file…";
        await uploadRequest(`/file/upload/complete?${new URLSearchParams({
          filehash: hash
        })}`);
        window.location.assign("/file/home");
      } catch (error) {
        status.textContent = error.message + " Select Upload to try again.";
      } finally {
        button.disabled = false;
        input.disabled = false;
      }
    });
  </script>
</body>
</html>
