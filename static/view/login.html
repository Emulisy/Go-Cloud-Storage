<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GoCloud — your files, in one place.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css?v=10">
  <title>Sign in — GoCloud</title>
</head>
<body class="auth-page"><a class="skip-link" href="#main-content">Skip to content</a><main class="auth-shell" id="main-content"><div class="auth-form-wrap"><a class="brand-lock" href="/" aria-label="GoCloud home"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 8.9 4.6 4.6 0 0 0 7 18Z"/></svg></span><span class="brand-name">GoCloud</span></a><div class="screen-heading"><h1>Sign in to GoCloud</h1><p>Welcome back. Your files are right here.</p></div><form id="auth-form" class="form-stack" action="/api/sessions" method="post" data-mode="login">

  <div class="field"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required></div>
  <div class="field"><label for="login-password">Password</label><input id="login-password" name="userPwd" type="password" autocomplete="current-password" minlength="5" maxlength="72" placeholder="Enter your password" required></div>

  <button class="button button-primary button-full" type="submit">Sign in</button><p id="auth-status" class="status" role="status" aria-live="polite"></p>
</form><p class="screen-switch">New to GoCloud? <a href="/file/signup">Create an account</a></p></div><p class="auth-footer">GoCloud · Cloud file storage</p></main><script src="/assets/app.js?v=10"></script></body></html>
