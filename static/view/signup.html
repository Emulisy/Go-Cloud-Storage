<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a goCloudStorage account in the application.">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>Create account — goCloudStorage</title>
    <link rel="stylesheet" href="/assets/styles.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body.rhine-theme { --r-ink:#11130f; --r-paper:#f4f5f1; --r-green:#9ac43c; background:var(--r-paper); color:var(--r-ink); }
      body.rhine-theme::before { background:linear-gradient(rgba(17,19,15,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(17,19,15,.025) 1px,transparent 1px); background-size:100% 36px,36px 100%; mix-blend-mode:normal; }
      .rhine-theme .auth-shell { grid-template-columns:minmax(330px,42%) 1fr; background:transparent; }
      .rhine-theme .auth-casing { background:rgba(255,255,255,.72); border-right:1px solid var(--r-ink); padding:38px; }
      .rhine-theme .auth-casing::before { content:"+"; position:absolute; right:-18px; top:46px; font:42px/1 "IBM Plex Mono"; z-index:3; }
      .rhine-theme .brand-lock { border:1px solid var(--r-ink); box-shadow:4px 4px 0 var(--r-ink); background:white; }
      .rhine-theme .brand-mark { background:var(--r-ink); color:white; border:0; }
      .rhine-theme .cassette-card { background:var(--r-ink); color:white; border:0; box-shadow:10px 10px 0 rgba(154,196,60,.7); }
      .rhine-theme .cassette-card h1 { color:white; font-size:clamp(40px,5vw,76px); letter-spacing:-.04em; }
      .rhine-theme .cassette-card p { color:#dfe2db; max-width:560px; }
      .rhine-theme .cassette-tag { background:var(--r-green); color:var(--r-ink); border:0; }
      .rhine-theme .tape-reels { border:1px solid rgba(255,255,255,.38); background:transparent; }
      .rhine-theme .reel { border-color:white; background:var(--r-green); }
      .rhine-theme .auth-panel { background:linear-gradient(135deg,rgba(154,196,60,.12),transparent 45%); padding:clamp(28px,6vw,90px); }
      .rhine-theme .console-frame { border:0; background:transparent; box-shadow:none; padding:0; width:min(560px,100%); }
      .rhine-theme .console-frame::before { background:var(--r-green); border-bottom:1px solid var(--r-ink); }
      .rhine-theme .terminal-screen { background:rgba(255,255,255,.94); border:1px solid var(--r-ink); box-shadow:14px 14px 0 rgba(17,19,15,.13),inset 0 -9px 0 var(--r-green); padding:clamp(28px,4vw,52px); transform:rotate(-.7deg); }
      .rhine-theme .terminal-screen::before { content:"+"; position:absolute; right:-24px; top:-36px; font:48px/1 "IBM Plex Mono"; }
      .rhine-theme .screen-heading { border-bottom:1px solid var(--r-ink); }
      .rhine-theme .screen-heading h2 { font-size:32px; letter-spacing:-.02em; }
      .rhine-theme .status-led { color:var(--r-ink); }
      .rhine-theme .status-led::before { background:var(--r-green); box-shadow:none; }
      .rhine-theme input { border:1px solid var(--r-ink); border-radius:0; background:#fff; box-shadow:none; }
      .rhine-theme input:focus { outline:3px solid rgba(154,196,60,.45); border-color:var(--r-ink); }
      .rhine-theme .button { border:1px solid var(--r-ink); border-radius:0; box-shadow:4px 4px 0 var(--r-ink); }
      .rhine-theme .button-primary { background:var(--r-green); color:var(--r-ink); }
      @media(max-width:900px){ .rhine-theme .auth-shell{grid-template-columns:1fr}.rhine-theme .auth-casing{border-right:0;border-bottom:1px solid var(--r-ink);min-height:auto}.rhine-theme .auth-panel{padding:32px 20px}.rhine-theme .terminal-screen{transform:none} }
    </style>
  </head>
  <body class="rhine-theme">
    <div class="page auth-shell">
      <aside class="auth-casing">
        <a class="brand-lock" href="/" aria-label="Go to main page">
          <span class="brand-mark">gC</span>
          <span class="brand-name">GoCloud Storage</span>
        </a>
        <div class="cassette-card">
          <span class="cassette-tag">NEW ACCOUNT · PRIVATE STORAGE</span>
          <h1>Create your account.</h1>
          <p>Set up your name, email, and password to start uploading and managing files.</p>
          <div class="tape-reels">
            <span class="reel" aria-hidden="true"></span>
            <span class="tape-strip" aria-hidden="true"></span>
            <span class="reel" aria-hidden="true"></span>
          </div>
        </div>
      </aside>

      <section class="auth-panel">
        <div class="console-frame">
          <div class="terminal-screen">
            <div class="screen-heading">
              <h2 id="signup-heading">Create account</h2>
              <div class="status-led">Awaiting input</div>
            </div>

            <form id="auth-form" class="form-stack" action="/api/users" method="post" data-mode="signup">
              <div class="field">
                <label for="signup-username">Display name</label>
                <input id="signup-username" name="userName" autocomplete="username" minlength="3" maxlength="64" placeholder="Choose a username" required>
              </div>

              <div class="field">
                <label for="auth-email">Email address</label>
                <input id="auth-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required>
              </div>

              <div class="field">
                <label for="signup-password">Password</label>
                <input id="signup-password" name="userPwd" type="password" autocomplete="new-password" minlength="5" maxlength="72" placeholder="Create a password" required>
              </div>

              <div class="field">
                <label for="signup-confirm">Confirm password</label>
                <input id="signup-confirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
              </div>

              <div class="form-actions">
                <button class="button button-primary" type="submit">Create account</button>
              </div>

              <p id="auth-status" class="status" role="status" aria-live="polite"></p>
            </form>

            <div class="screen-switch">
              Already have an account? <a href="/file/signin">Sign in</a>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="/assets/app.js?v=3"></script>
  </body>
</html>
