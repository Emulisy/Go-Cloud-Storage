<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · goCloudStorage</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; color: #172033; background: #f5f7fb; }
    main { background: white; border: 1px solid #dfe5ef; border-radius: 14px; padding: 2rem; box-shadow: 0 12px 35px rgba(30, 50, 80, .08); }
    h1 { margin-top: 0; }
    form { display: grid; gap: 1rem; margin-top: 1.5rem; }
    label { display: grid; gap: .4rem; font-weight: 650; }
    input { width: 100%; padding: .75rem; border: 1px solid #bac5d6; border-radius: 8px; background: white; font: inherit; }
    input:focus { border-color: #245dcc; outline: 3px solid rgba(36, 93, 204, .16); }
    button { padding: .75rem 1rem; border: 0; border-radius: 8px; color: white; background: #245dcc; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    a { color: #245dcc; }
    .hint { color: #536176; font-size: .92rem; }
    .warning { padding: .8rem 1rem; border-radius: 8px; color: #714b00; background: #fff4d8; }
    .status { min-height: 1.5rem; margin-bottom: 0; }
    .status.success { color: #246b3f; }
    .status.error { color: #a21d1d; }
    .back { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Create a demo account</h1>
    <p>Sign up to try the local goCloudStorage demo.</p>
    <p class="warning"><strong>Demo only:</strong> passwords are not hashed yet. Do not use a real password.</p>

    <form id="signup-form" action="/file/signup" method="post">
      <label>
        Username
        <input
          type="text"
          name="userName"
          minlength="3"
          maxlength="64"
          autocomplete="username"
          required>
      </label>

      <label>
        Password
        <input
          type="password"
          name="userPwd"
          minlength="5"
          autocomplete="new-password"
          required>
        <span class="hint">Use at least 5 characters for this demo.</span>
      </label>

      <button id="submit" type="submit">Create account</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="back"><a href="/file/upload">Back to file upload</a></p>
  </main>

  <script>
    const form = document.querySelector("#signup-form");
    const submit = document.querySelector("#submit");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) {
        return;
      }

      submit.disabled = true;
      status.className = "status";
      status.textContent = "Creating account…";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(new FormData(form))
        });

        if (response.status === 201) {
          form.reset();
          status.className = "status success";
          status.textContent = "Account created successfully.";
          return;
        }

        status.className = "status error";
        if (response.status === 400) {
          status.textContent = "Enter a username of 3–64 characters and a password of at least 5 characters.";
        } else if (response.status === 409) {
          status.textContent = "That username already exists.";
        } else {
          status.textContent = "Unable to create the account. Please try again.";
        }
      } catch (_) {
        status.className = "status error";
        status.textContent = "Unable to reach the server. Please try again.";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
